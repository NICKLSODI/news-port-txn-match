<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TradingView</title>
    <!--
      หน้านี้มีไว้เพื่อครอบ widget ของ TradingView ไว้ใน iframe ต่างหาก

      ทำไมต้องเป็นไฟล์จริง ไม่ใช่ data: URL — widget ของ TradingView ตรวจ origin
      ของหน้าที่ฝังมัน ถ้า origin เป็น null (อย่าง data: URL) มันจะค้างที่วงกลมโหลด
      ตลอดไป จึงต้องเสิร์ฟจากโดเมนเดียวกับตัวเว็บ

      สคริปต์ในหน้านี้โหลดจากเซิร์ฟเวอร์ของ TradingView และเห็นแค่ชื่อสัญลักษณ์
      ส่วนอื่นของระบบไม่ได้อยู่ในหน้านี้ จึงแตะข้อมูลลูกค้าไม่ได้
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font: 12px/1.5 system-ui, sans-serif;
      }
      #wrap {
        height: 100%;
      }
      #fail {
        display: none;
        padding: 16px;
        color: #6b6b6b;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="tv"></div></div>
    <p id="fail">โหลดกราฟ TradingView ไม่สำเร็จ (อาจถูกไฟร์วอลล์ขององค์กรบล็อก)</p>
    <script>
      var q = new URLSearchParams(location.search)
      var symbol = q.get('symbol') || ''
      // รับเฉพาะรูปแบบ VENUE:SYMBOL เท่าที่ prices.py สร้าง — กันค่าที่ถูกใส่มาเอง
      if (!/^[A-Z0-9_]{2,12}:[A-Za-z0-9._-]{1,15}$/.test(symbol)) symbol = ''

      if (!symbol) {
        document.getElementById('fail').style.display = 'block'
      } else {
        var s = document.createElement('script')
        s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js'
        s.async = true
        s.onerror = function () {
          document.getElementById('fail').style.display = 'block'
        }
        s.text = JSON.stringify({
          symbol: symbol,
          theme: q.get('theme') === 'dark' ? 'dark' : 'light',
          locale: q.get('locale') === 'th' ? 'th_TH' : 'en',
          interval: 'D',
          style: '1', // 1 = แท่งเทียน
          container_id: 'tv',
          width: '100%',
          height: '100%',
          hide_side_toolbar: true,
          allow_symbol_change: false,
          save_image: false,
          withdateranges: true,
        })
        document.getElementById('wrap').appendChild(s)
      }
    </script>
  </body>
</html>
